#cloud-config
package_update: true
package_upgrade: false

packages:
  - build-essential
  - ca-certificates
  - curl
  - docker.io
  - docker-compose-v2
  - gh
  - git
  - jq
  - python3
  - shellcheck
  - unzip

users:
  - default
  - name: runner
    gecos: GitHub Actions runner
    groups:
      - docker
    shell: /bin/bash
    lock_passwd: true

runcmd:
  - systemctl enable --now docker
  - install -d -o runner -g runner /opt/actions-runner

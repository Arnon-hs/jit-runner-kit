name: CI with zero GitHub-hosted minutes

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ephemeral-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: [self-hosted, linux, x64, jit-runner]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run any project CI command
        run: ./your-ci-command

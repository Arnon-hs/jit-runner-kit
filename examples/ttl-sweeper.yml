name: Sweep expired ephemeral runners

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Only report expired resources
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: your-org/jit-runner-kit/actions/sweep@v1
        with:
          hcloud-token: ${{ secrets.HCLOUD_TOKEN }}
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || false }}


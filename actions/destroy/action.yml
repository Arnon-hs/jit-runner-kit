name: Destroy ephemeral JIT runner
description: Destroy a runner and its Hetzner Cloud resources.

inputs:
  hcloud-token:
    description: Hetzner Cloud project token.
    required: true
  github-token:
    description: GitHub token with Administration write on the target repository.
    required: true
  iac-engine:
    description: Infrastructure engine to install (opentofu or terraform).
    required: false
    default: opentofu
  state-dir:
    description: Downloaded infrastructure state directory.
    required: true
  run-key:
    description: Optional run key fallback when metadata is unavailable.
    default: ""
  repository:
    description: Optional target repository fallback when metadata is unavailable.
    default: ""
  runner-id:
    description: Optional GitHub runner ID fallback when metadata is unavailable.
    default: ""

runs:
  using: composite
  steps:
    - name: Validate infrastructure engine
      shell: bash
      env:
        IAC_ENGINE: ${{ inputs.iac-engine }}
      run: |
        case "$IAC_ENGINE" in
          opentofu|terraform) ;;
          *) echo "iac-engine must be opentofu or terraform" >&2; exit 1 ;;
        esac
    - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
      if: ${{ inputs.iac-engine == 'opentofu' }}
      with:
        tofu_wrapper: false
    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      if: ${{ inputs.iac-engine == 'terraform' }}
      with:
        terraform_wrapper: false
    - shell: bash
      env:
        HCLOUD_TOKEN: ${{ inputs.hcloud-token }}
        JIT_RUNNER_GITHUB_TOKEN: ${{ inputs.github-token }}
        JIT_RUNNER_IAC_CMD: ${{ inputs.iac-engine == 'opentofu' && 'tofu' || 'terraform' }}
        INPUT_STATE_DIR: ${{ inputs.state-dir }}
        INPUT_RUN_KEY: ${{ inputs.run-key }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_RUNNER_ID: ${{ inputs.runner-id }}
      run: |
        args=(destroy --state-dir "$INPUT_STATE_DIR")
        if [[ -n "$INPUT_RUN_KEY" ]]; then
          args+=(--run-key "$INPUT_RUN_KEY")
        fi
        if [[ -n "$INPUT_REPOSITORY" && -n "$INPUT_RUNNER_ID" ]]; then
          args+=(--repository "$INPUT_REPOSITORY" --runner-id "$INPUT_RUNNER_ID")
        fi
        "${GITHUB_ACTION_PATH}/../../bin/jit-runner" "${args[@]}"

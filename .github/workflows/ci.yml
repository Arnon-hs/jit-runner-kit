name: CI

on:
  workflow_dispatch:
    inputs:
      workload-mode:
        description: Dogfood workload outcome to exercise
        required: true
        default: success
        type: choice
        options:
          - success
          - fail
      ttl-minutes:
        description: Resource TTL for cleanup canaries
        required: true
        default: 180
        type: number
      hold-seconds:
        description: Keep the workload active for cancellation canaries
        required: true
        default: 0
        type: number
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Public quality gates
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: make check

  dogfood-provision:
    name: Provision trusted JIT runner
    if: ${{ github.event_name == 'workflow_dispatch' && vars.JIT_RUNNER_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    outputs:
      runner-label: ${{ steps.runner.outputs.runner-label }}
      runner-id: ${{ steps.runner.outputs.runner-id }}
      run-key: ${{ steps.runner.outputs.run-key }}
    steps:
      - id: runner
        uses: Arnon-hs/jit-runner-kit/actions/provision@96807f37c85f7f6f6b5743e305e6385157fafd4d
        with:
          hcloud-token: ${{ secrets.HCLOUD_TOKEN }}
          github-token: ${{ secrets.JIT_RUNNER_GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          server-type: cx33
          location: fsn1
          ttl-minutes: ${{ inputs.ttl-minutes }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runner-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.runner.outputs.state-dir }}
          if-no-files-found: error
          retention-days: 1

  dogfood-workload:
    name: Trusted JIT dogfood
    needs: dogfood-provision
    runs-on: [self-hosted, linux, x64, "${{ needs.dogfood-provision.outputs.runner-label }}"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false
      - name: Hold cancellation canary
        if: inputs.hold-seconds > 0
        run: sleep "${{ inputs.hold-seconds }}"
      - name: Run successful workload canary
        if: inputs.workload-mode == 'success'
        run: make check
      - name: Fail workload canary intentionally
        if: inputs.workload-mode == 'fail'
        run: |
          echo "Intentional dogfood failure: cleanup must still run."
          exit 42

  dogfood-cleanup:
    name: Cleanup trusted JIT runner
    if: ${{ always() && needs.dogfood-provision.result != 'skipped' }}
    needs: [dogfood-provision, dogfood-workload]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: runner-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/jit-runner-state
      - uses: Arnon-hs/jit-runner-kit/actions/destroy@96807f37c85f7f6f6b5743e305e6385157fafd4d
        with:
          hcloud-token: ${{ secrets.HCLOUD_TOKEN }}
          github-token: ${{ secrets.JIT_RUNNER_GITHUB_TOKEN }}
          state-dir: ${{ runner.temp }}/jit-runner-state
          run-key: ${{ needs.dogfood-provision.outputs.run-key }}
          repository: ${{ github.repository }}
          runner-id: ${{ needs.dogfood-provision.outputs.runner-id }}

name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Public quality gates
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false
      - run: make check

  dogfood-provision:
    name: Provision trusted JIT runner
    if: ${{ github.event_name == 'workflow_dispatch' && vars.JIT_RUNNER_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    outputs:
      runner-label: ${{ steps.runner.outputs.runner-label }}
      runner-id: ${{ steps.runner.outputs.runner-id }}
      run-key: ${{ steps.runner.outputs.run-key }}
    steps:
      - id: runner
        uses: Arnon-hs/jit-runner-kit/actions/provision@8da3fac3bcefaf9671d8eb8115f0ead5c3b5cf51
        with:
          hcloud-token: ${{ secrets.HCLOUD_TOKEN }}
          github-token: ${{ secrets.JIT_RUNNER_GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          server-type: cx33
          location: fsn1
          ttl-minutes: 180
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runner-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.runner.outputs.state-dir }}
          if-no-files-found: error
          retention-days: 1

  dogfood-workload:
    name: Trusted JIT dogfood
    needs: dogfood-provision
    runs-on: [self-hosted, linux, x64, "${{ needs.dogfood-provision.outputs.runner-label }}"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.12.6
          tofu_wrapper: false
      - run: make check

  dogfood-cleanup:
    name: Cleanup trusted JIT runner
    if: ${{ always() && needs.dogfood-provision.result != 'skipped' }}
    needs: [dogfood-provision, dogfood-workload]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: runner-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/jit-runner-state
      - uses: Arnon-hs/jit-runner-kit/actions/destroy@8da3fac3bcefaf9671d8eb8115f0ead5c3b5cf51
        with:
          hcloud-token: ${{ secrets.HCLOUD_TOKEN }}
          github-token: ${{ secrets.JIT_RUNNER_GITHUB_TOKEN }}
          state-dir: ${{ runner.temp }}/jit-runner-state
          run-key: ${{ needs.dogfood-provision.outputs.run-key }}
          repository: ${{ github.repository }}
          runner-id: ${{ needs.dogfood-provision.outputs.runner-id }}

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    if: ${{ vars.JIT_RUNNER_ENABLED == 'true' }}
    runs-on: [self-hosted, linux, x64, jit-runner]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - run: make check

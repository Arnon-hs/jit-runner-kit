name: Resource inventory

on:
  workflow_dispatch:
    inputs:
      require-empty:
        description: Fail if any jit-runner-kit resources remain
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  inventory:
    name: Count managed Hetzner resources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./actions/inventory
        with:
          hcloud-token: ${{ secrets.HCLOUD_TOKEN }}
          require-empty: ${{ inputs.require-empty }}

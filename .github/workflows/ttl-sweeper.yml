name: TTL sweeper

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Report expired resources without deleting them
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: jit-runner-kit-ttl-sweeper
  cancel-in-progress: false

jobs:
  sweep:
    name: Remove expired Hetzner resources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./actions/sweep
        with:
          hcloud-token: ${{ secrets.HCLOUD_TOKEN }}
          dry-run: ${{ inputs.dry-run || false }}

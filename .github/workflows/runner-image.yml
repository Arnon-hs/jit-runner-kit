name: Runner image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/runner-image.yml
      - providers/shared-host/Dockerfile.runner
      - providers/shared-host/runner-entrypoint.sh

permissions:
  contents: read
  checks: read
  packages: write

concurrency:
  group: runner-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/arnon-hs/jit-runner-kit-runner
  RUNNER_VERSION: 2.338.2
  RUNNER_SHA256_X64: baebf204307bac6193480852732f0aba2ae97b6c5597c244f4d5558390147c40
  RUNNER_SHA256_ARM64: 670adb2f268fe21dcbb58b3db0e0aa9d5b3bddfe2c651481336e561ff86de945

jobs:
  publish:
    name: Build immutable runner image
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.event.repository.private == false && github.repository == 'Arnon-hs/jit-runner-kit'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require successful quality checks for this exact source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            checks="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100")"
            if jq -e '.check_runs | any(.app.slug == "github-actions" and .name == "Public quality gates" and .conclusion == "success")' <<<"$checks" >/dev/null; then
              exit 0
            fi
            if jq -e '.check_runs | any(.app.slug == "github-actions" and .name == "Public quality gates" and .status == "completed" and .conclusion != "success")' <<<"$checks" >/dev/null; then
              echo 'Exact-source quality checks did not pass' >&2
              exit 1
            fi
            sleep 10
          done
          echo 'Exact-source quality checks are missing' >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: providers/shared-host
          file: providers/shared-host/Dockerfile.runner
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          build-args: |
            RUNNER_VERSION=${{ env.RUNNER_VERSION }}
            RUNNER_SHA256_X64=${{ env.RUNNER_SHA256_X64 }}
            RUNNER_SHA256_ARM64=${{ env.RUNNER_SHA256_ARM64 }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.title=JIT Runner Kit workload image
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record immutable identity
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test "$DIGEST" != ""
          actual="$(docker run --rm --entrypoint /opt/actions-runner/bin/Runner.Listener "$IMAGE@$DIGEST" --version)"
          test "$actual" = "$RUNNER_VERSION"
          printf '### Immutable runner image\n\n%s@%s\n' "$IMAGE" "$DIGEST" >>"$GITHUB_STEP_SUMMARY"

name: Runner image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/runner-image.yml
      - providers/shared-host/Dockerfile.runner
      - providers/shared-host/runner-entrypoint.sh

permissions:
  contents: read
  packages: write

concurrency:
  group: runner-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/arnon-hs/jit-runner-kit-runner
  RUNNER_VERSION: 2.336.0
  RUNNER_SHA256_X64: 04cf0be1aff4c3ec3554466c39124ca250e3effd8873bb7e8d68535aa9505d5d
  RUNNER_SHA256_ARM64: 58b758e420b87093fbd4bfddd368074960053e2f1388f01848c82624b90f27d1

jobs:
  publish:
    name: Build immutable runner image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: providers/shared-host
          file: providers/shared-host/Dockerfile.runner
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          build-args: |
            RUNNER_VERSION=${{ env.RUNNER_VERSION }}
            RUNNER_SHA256_X64=${{ env.RUNNER_SHA256_X64 }}
            RUNNER_SHA256_ARM64=${{ env.RUNNER_SHA256_ARM64 }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.title=JIT Runner Kit workload image
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record immutable identity
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test "$DIGEST" != ""
          printf '### Immutable runner image\n\n%s@%s\n' "$IMAGE" "$DIGEST" >>"$GITHUB_STEP_SUMMARY"

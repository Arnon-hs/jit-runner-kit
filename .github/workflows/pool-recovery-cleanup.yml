name: Pool recovery cleanup

on:
  workflow_dispatch:
    inputs:
      pool-id:
        description: Exact jit-runner-kit pool_id label
        required: true
        type: string
      delete:
        description: Delete the previewed pool resources
        required: false
        default: false
        type: boolean
      confirmation:
        description: For deletion type DELETE followed by the pool ID
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: jit-runner-kit-pool-recovery
  cancel-in-progress: false

jobs:
  cleanup:
    name: Preview or remove one labeled pool
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run exact pool cleanup
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          POOL_ID: ${{ inputs.pool-id }}
          DELETE_POOL: ${{ inputs.delete }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          args=(pool-cleanup --pool-id "$POOL_ID")
          if [[ "$DELETE_POOL" == true ]]; then
            args+=(--delete --confirmation "$CONFIRMATION")
          fi
          bin/jit-runner "${args[@]}"
